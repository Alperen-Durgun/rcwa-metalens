name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          - os: windows-latest          # the pure-Python GDS writer exists because of Windows paths
            python-version: "3.12"

    env:
      MPLBACKEND: Agg   # headless matplotlib

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the package (as a user would)
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Lint (pyflakes rules)
        run: ruff check .

      - name: Unit tests (solvers, design core, GDS, materials)
        run: pytest tests/test_rcwa.py

      - name: End-to-end tests (all 24 generators, CLI, note workflow)
        run: pytest tests/test_experiments.py

      - name: Benchmark suite (values must match benchmarks/baseline.json; times are reported only)
        run: python benchmarks/run.py --check

      - name: Installed command works outside the repository
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          rcwa-metalens --version
          rcwa-metalens list
          rcwa-metalens grating period=1.3 --out "$RUNNER_TEMP/rcwa_out"
